<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraising Hub</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { 
                    colors: { 
                        gray: { 
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            850: '#1f1f22',
                            900: '#18181b',
                            950: '#09090b',
                            black: '#000000'
                        } 
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill-emoji@0.2.0/dist/quill-emoji.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-emoji@0.2.0/dist/quill-emoji.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="https://unpkg.com/panzoom@9.4.0/dist/panzoom.min.js"></script>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-12 dark:bg-black dark:text-gray-100 transition-colors duration-300">

<div id="loadingOverlay" class="fixed inset-0 bg-white/90 dark:bg-black/90 z-50 flex flex-col items-center justify-center hidden">
    <div class="loader border-gray-900 dark:border-gray-100 border-t-transparent dark:border-t-transparent rounded-full w-10 h-10 border-2 animate-spin"></div>
    <p id="loadingText" class="mt-4 font-semibold text-gray-900 dark:text-gray-100 animate-pulse">Processing...</p>
</div>

<header class="bg-white text-gray-900 border-b border-gray-200 py-3 px-4 shadow-sm sticky top-0 z-40 dark:bg-black dark:text-gray-100 dark:border-gray-800 transition-colors duration-300">
    <div class="flex justify-between items-center max-w-lg mx-auto">
        <div class="flex items-center gap-3">
            <button id="backBtn" class="hidden text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
            <h1 class="font-display font-semibold text-lg tracking-tight cursor-pointer" onclick="Router.navigate('landing')" id="appTitleDisplay">Fundraising Hub</h1>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="toggleDarkMode()" class="text-xl p-1 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-transform hover:scale-110" title="Toggle Dark Mode">🌗</button>
            <i class="fas fa-cog text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors cursor-pointer mt-0.5" onclick="Router.navigate('admin_login')"></i>
            <div class="relative cursor-pointer hidden text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors" id="headerCartIcon" onclick="Router.navigate('cart')">
                <i class="fas fa-shopping-bag text-lg"></i>
                <span id="headerCartCount" class="absolute -top-1.5 -right-2 bg-gray-900 text-white dark:bg-white dark:text-black text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center ring-2 ring-white dark:ring-black">0</span>
            </div>
        </div>
    </div>
</header>

<main class="max-w-lg mx-auto min-h-screen relative px-3" id="app-container">
    <!-- Views injected via JS -->
</main>

<script src="/js/app.js"></script>
</body>
</html>
